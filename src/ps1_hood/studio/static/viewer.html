<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>ps1-hood viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0b0c; color: #eee; font: 13px/1.4 sans-serif; overflow: hidden; }
    #hud { position: absolute; left: 12px; top: 12px; z-index: 2; background: rgba(12,12,14,.72); padding: 10px 12px; border: 1px solid #333; }
    a { color: #e8c36a; }
    canvas { display: block; }
    label { cursor: pointer; user-select: none; }
  </style>
</head>
<body>
  <div id="hud">loading…</div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
    import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
    import { TransformControls } from 'three/addons/controls/TransformControls.js';

    const params = new URLSearchParams(location.search);
    const run = params.get('run');
    const hud = document.getElementById('hud');
    if (!run) { hud.textContent = 'missing ?run='; throw new Error('run'); }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101114);
    scene.fog = new THREE.Fog(0x101114, 80, 260);
    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 800);
    camera.position.set(18, 28, 24);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(devicePixelRatio);
    document.body.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0, 0);
    scene.add(new THREE.AmbientLight(0xffffff, 0.85));
    const sun = new THREE.DirectionalLight(0xffe6c0, 0.95);
    sun.position.set(20, 40, 10);
    scene.add(sun);
    scene.add(new THREE.GridHelper(120, 40, 0x333333, 0x222222));

    const sceneJson = await (await fetch('/api/runs/' + encodeURIComponent(run) + '/scene')).json();
    hud.innerHTML = `<b>${sceneJson.name}</b><br>${sceneJson.cameras.length} cameras`
      + `<br><label><input type="checkbox" id="togCloud"> cloud (raw MA)</label>`
      + ` <label><input type="checkbox" id="togZclean"> zclean</label>`
      + ` <label><input type="checkbox" id="togOfftile"> offtile</label>`
      + ` <label><input type="checkbox" id="togFacades" checked> facades</label>`
      + ` <label><input type="checkbox" id="togRoofs" checked> roofs</label>`
      + ` <label><input type="checkbox" id="togBag"> BAG</label>`
      + `<br><label><input type="checkbox" id="togSculpt"> sculpt</label>`
      + ` <button type="button" id="btnSculptTranslate" disabled>nudge n</button>`
      + ` <button type="button" id="btnSculptScale" disabled>resize w×h</button>`
      + ` <button type="button" id="btnSculptSave" disabled>save+bake</button>`
      + ` <button type="button" id="btnSculptUndo" disabled>undo</button>`
      + `<br><span id="sculptStatus" style="color:#9ad">sculpt: off</span>`
      + `<br><label>bake cam <select id="sculptCam" disabled><option value="">frontal</option></select></label>`
      + `<br><a href="/">back</a>`;

    // ENU (x=east, y=north, z=up) → Three (x, y=up, z=south-ish): (e, u, -n)
    const to3 = (e, n, u) => new THREE.Vector3(e, u, -n);

    const remapEnuGeometry = (geom) => {
      const pos = geom.getAttribute('position');
      if (!pos) return;
      for (let i = 0; i < pos.count; i++) {
        const e = pos.getX(i), n = pos.getY(i), u = pos.getZ(i);
        pos.setXYZ(i, e, u, -n);
      }
      pos.needsUpdate = true;
      geom.computeVertexNormals();
    };

    // LocalFrame ENU (matches ps1_hood.geo.LocalFrame) for sat plane when scene.satellite.enu absent
    const WGS84_A = 6378137.0, WGS84_E2 = (1 / 298.257223563) * (2 - 1 / 298.257223563);
    const geodeticToEcef = (lat, lon, alt = 0) => {
      const phi = lat * Math.PI / 180, lam = lon * Math.PI / 180;
      const sphi = Math.sin(phi), cphi = Math.cos(phi);
      const N = WGS84_A / Math.sqrt(1 - WGS84_E2 * sphi * sphi);
      return [(N + alt) * cphi * Math.cos(lam), (N + alt) * cphi * Math.sin(lam), (N * (1 - WGS84_E2) + alt) * sphi];
    };
    const makeLocalFrame = (lat0, lon0) => {
      const origin = geodeticToEcef(lat0, lon0, 0);
      const phi = lat0 * Math.PI / 180, lam = lon0 * Math.PI / 180;
      const sphi = Math.sin(phi), cphi = Math.cos(phi);
      const slam = Math.sin(lam), clam = Math.cos(lam);
      const r = [
        [-slam, clam, 0],
        [-sphi * clam, -sphi * slam, cphi],
        [cphi * clam, cphi * slam, sphi],
      ];
      return (lat, lon, alt = 0) => {
        const [x, y, z] = geodeticToEcef(lat, lon, alt);
        const dx = x - origin[0], dy = y - origin[1], dz = z - origin[2];
        return [
          r[0][0] * dx + r[0][1] * dy + r[0][2] * dz,
          r[1][0] * dx + r[1][1] * dy + r[1][2] * dz,
          r[2][0] * dx + r[2][1] * dy + r[2][2] * dz,
        ];
      };
    };
    // Sat ground plane from satellite.bbox Ortho ENU (NOT camera-hull AABB)
    const satPlaneFromScene = (sj) => {
      const enu = sj.satellite && sj.satellite.enu;
      if (enu && Number.isFinite(enu.sw) && Number.isFinite(enu.ee)
          && Number.isFinite(enu.sh) && Number.isFinite(enu.nn)) {
        return { sw: enu.sw, sh: enu.sh, ee: enu.ee, nn: enu.nn };
      }
      const bb = (sj.satellite && sj.satellite.bbox) || sj.bbox;
      const o = sj.origin;
      if (!bb || !o) return null;
      const toEnu = makeLocalFrame(o.lat, o.lon);
      const [sw, sh] = toEnu(bb.south, bb.west);
      const [ee, nn] = toEnu(bb.north, bb.east);
      return { sw, sh, ee, nn };
    };
    const satUrl = '/api/runs/' + encodeURIComponent(run) + '/satellite.jpg';
    const tex = new THREE.TextureLoader().load(satUrl);
    tex.colorSpace = THREE.SRGBColorSpace;
    const satEnu = satPlaneFromScene(sceneJson);
    let gw = 40, gh = 40, cx = 0, cz = 0;
    if (satEnu) {
      gw = Math.max(1e-3, satEnu.ee - satEnu.sw);
      gh = Math.max(1e-3, satEnu.nn - satEnu.sh);
      cx = (satEnu.sw + satEnu.ee) / 2;
      cz = (satEnu.sh + satEnu.nn) / 2;
    }
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(gw, gh),
      new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.copy(to3(cx, cz, 0));
    scene.add(ground);

    // BAG shells: default hidden (align prior / debug only — photo ENU is hero)
    const bagGroup = new THREE.Group();
    bagGroup.visible = false;
    scene.add(bagGroup);
    let bagUMin = Infinity, bagUMax = -Infinity, bagVertCount = 0;
    for (const b of (sceneJson.buildings || [])) {
      const verts = b.vertices || [];
      const faces = b.faces || [];
      const pos = [];
      for (const f of faces) {
        const a = verts[f[0]], bb = verts[f[1]], c = verts[f[2]];
        if (!a || !bb || !c) continue;
        pos.push(a[0], a[2], -a[1], bb[0], bb[2], -bb[1], c[0], c[2], -c[1]);
        for (const v of [a, bb, c]) {
          bagUMin = Math.min(bagUMin, v[2]);
          bagUMax = Math.max(bagUMax, v[2]);
          bagVertCount++;
        }
      }
      if (!pos.length) continue;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.computeVertexNormals();
      bagGroup.add(new THREE.Mesh(geo, new THREE.MeshLambertMaterial({
        color: 0x8a6a3c, side: THREE.DoubleSide, transparent: true, opacity: 0.35
      })));
    }
    // Soft note: BAG Z often NAP-as-alt while SV cams force u≈2.5 ellipsoid
    const camU = (sceneJson.cameras || []).map(c => c.u).filter(Number.isFinite);
    const camUMed = camU.length ? camU.slice().sort((a,b)=>a-b)[Math.floor(camU.length/2)] : 2.5;
    if (bagVertCount && Number.isFinite(bagUMin) && Math.abs(bagUMin - (camUMed - 2.5)) > 3) {
      hud.innerHTML += `<br><span style="color:#c9a227">note: BAG Z may be NAP-as-alt vs cam u≈${camUMed.toFixed(1)} (debug only)</span>`;
    }

    const loader = new THREE.TextureLoader();
    for (const c of sceneJson.cameras) {
      const group = new THREE.Group();
      group.position.copy(to3(c.e, c.n, c.u));
      group.rotation.order = 'YXZ';
      group.rotation.y = THREE.MathUtils.degToRad(-c.heading);
      group.rotation.x = THREE.MathUtils.degToRad(c.pitch || 0);
      const helper = new THREE.ArrowHelper(new THREE.Vector3(0, 0, -1), new THREE.Vector3(), 3, 0xe8c36a);
      group.add(helper);
      if (c.image) {
        const rel = c.image.split('/cropped/').pop();
        const url = '/api/runs/' + encodeURIComponent(run) + '/file?path=' + encodeURIComponent('cropped/' + rel);
        loader.load(url, (im) => {
          im.colorSpace = THREE.SRGBColorSpace;
          const aspect = (im.image.width || 4) / (im.image.height || 3);
          const plane = new THREE.Mesh(
            new THREE.PlaneGeometry(2.4 * aspect, 2.4),
            new THREE.MeshBasicMaterial({ map: im, side: THREE.DoubleSide, transparent: true, opacity: 0.92 })
          );
          plane.position.z = -2.2;
          group.add(plane);
        });
      }
      scene.add(group);
    }

    let cloudPoints = null;
    let zcleanPoints = null;
    let offtilePoints = null;
    try {
      const geom = await new PLYLoader().loadAsync('/api/runs/' + encodeURIComponent(run) + '/cloud.ply');
      remapEnuGeometry(geom);
      const mat = new THREE.PointsMaterial({ size: 0.06, vertexColors: true, opacity: 0.45, transparent: true });
      cloudPoints = new THREE.Points(geom, mat);
      cloudPoints.visible = false;  // hero default: façades + sat roofs; cloud = debug toggle
      scene.add(cloudPoints);
    } catch (err) {
      hud.innerHTML += '<br>no point cloud yet';
    }
    try {
      const geomZ = await new PLYLoader().loadAsync('/api/runs/' + encodeURIComponent(run) + '/cloud_zclean.ply');
      remapEnuGeometry(geomZ);
      const matZ = new THREE.PointsMaterial({ size: 0.06, vertexColors: true, opacity: 0.55, transparent: true });
      zcleanPoints = new THREE.Points(geomZ, matZ);
      zcleanPoints.visible = false;
      scene.add(zcleanPoints);
    } catch (err) {
      /* optional sidecar from ps1hood cloud-zclean */
    }
    try {
      const geomO = await new PLYLoader().loadAsync('/api/runs/' + encodeURIComponent(run) + '/cloud_offtile.ply');
      remapEnuGeometry(geomO);
      const matO = new THREE.PointsMaterial({ size: 0.06, vertexColors: true, opacity: 0.55, transparent: true });
      offtilePoints = new THREE.Points(geomO, matO);
      offtilePoints.visible = false;
      scene.add(offtilePoints);
    } catch (err) {
      /* optional sidecar from ps1hood cloud-offtile */
    }

    let facadeRoot = null;
    try {
      const base = '/api/runs/' + encodeURIComponent(run) + '/';
      const mtlLoader = new MTLLoader();
      mtlLoader.setPath(base);
      const materials = await mtlLoader.loadAsync('facades.mtl');
      materials.preload();
      for (const mat of Object.values(materials.materials)) {
        if (!mat) continue;
        mat.side = THREE.DoubleSide;
        if (mat.map) {
          mat.map.colorSpace = THREE.SRGBColorSpace;
          // PS1 look: blocky façade texels (no bilinear smear)
          mat.map.magFilter = THREE.NearestFilter;
          mat.map.minFilter = THREE.NearestFilter;
          mat.map.generateMipmaps = false;
          mat.map.needsUpdate = true;
        }
      }
      const objLoader = new OBJLoader();
      objLoader.setMaterials(materials);
      objLoader.setPath(base);
      facadeRoot = await objLoader.loadAsync('facades.obj');
      facadeRoot.traverse((child) => {
        if (child.isMesh && child.geometry) {
          remapEnuGeometry(child.geometry);
          if (child.material) {
            const mats = Array.isArray(child.material) ? child.material : [child.material];
            for (const m of mats) {
              m.side = THREE.DoubleSide;
              if (m.map) {
                m.map.colorSpace = THREE.SRGBColorSpace;
                m.map.magFilter = THREE.NearestFilter;
                m.map.minFilter = THREE.NearestFilter;
                m.map.generateMipmaps = false;
                m.map.needsUpdate = true;
              }
            }
          }
        }
      });
      scene.add(facadeRoot);
    } catch (err) {
      hud.innerHTML += '<br>no textured facades yet';
    }

    // Sat-locked roof/yard shells (PR-A) — Ortho ENU XY, separate from BAG
    let roofRoot = null;
    try {
      const base = '/api/runs/' + encodeURIComponent(run) + '/';
      const mtlLoader = new MTLLoader();
      mtlLoader.setPath(base);
      const roofMats = await mtlLoader.loadAsync('roofs.mtl');
      roofMats.preload();
      for (const mat of Object.values(roofMats.materials)) {
        if (!mat) continue;
        mat.side = THREE.DoubleSide;
        if (mat.map) {
          mat.map.colorSpace = THREE.SRGBColorSpace;
          mat.map.magFilter = THREE.NearestFilter;
          mat.map.minFilter = THREE.NearestFilter;
          mat.map.generateMipmaps = false;
          mat.map.needsUpdate = true;
        }
      }
      const objLoader = new OBJLoader();
      objLoader.setMaterials(roofMats);
      objLoader.setPath(base);
      roofRoot = await objLoader.loadAsync('roofs.obj');
      roofRoot.traverse((child) => {
        if (child.isMesh && child.geometry) {
          remapEnuGeometry(child.geometry);
          if (child.material) {
            const mats = Array.isArray(child.material) ? child.material : [child.material];
            for (const m of mats) {
              m.side = THREE.DoubleSide;
              if (m.map) {
                m.map.colorSpace = THREE.SRGBColorSpace;
                m.map.magFilter = THREE.NearestFilter;
                m.map.minFilter = THREE.NearestFilter;
                m.map.generateMipmaps = false;
                m.map.needsUpdate = true;
              }
            }
          }
        }
      });
      scene.add(roofRoot);
    } catch (err) {
      hud.innerHTML += '<br>no sat roofs yet';
    }


    // --- ENU façade sculpt (TransformControls; n-only translate + w×h scale; no free-pose) ---
    const SCULPT_MAX_D = 3.0;
    const SCULPT_MAX_T = 2.0;
    let planesPayload = null;
    let planeEntries = [];
    let sculptOn = false;
    let selected = null; // { id, index, nEnu, centerEnu, width_m, height_m, zncc, mesh }
    let baseSelect = null;
    const pickGroup = new THREE.Group();
    pickGroup.visible = false;
    scene.add(pickGroup);
    const sculptPivot = new THREE.Object3D();
    scene.add(sculptPivot);
    const tcontrols = new TransformControls(camera, renderer.domElement);
    tcontrols.enabled = false;
    tcontrols.visible = false;
    tcontrols.setSpace('local');
    tcontrols.showX = false; tcontrols.showY = false; tcontrols.showZ = true;
    scene.add(tcontrols.getHelper ? tcontrols.getHelper() : tcontrols);
    tcontrols.addEventListener('dragging-changed', (ev) => { controls.enabled = !ev.value; });

    const facadeAxesEnu = (nArr) => {
      const nx = nArr[0], ny = nArr[1];
      const nn = Math.hypot(nx, ny) || 1;
      const n = [nx / nn, ny / nn, 0];
      const t = [-n[1], n[0], 0]; // cross(up, n)
      const u = [0, 0, 1];
      return { n, t, u };
    };
    const cornersEnu = (center, nArr, w, h) => {
      const { t, u } = facadeAxesEnu(nArr);
      const hw = 0.5 * w, hh = 0.5 * h;
      const add = (a, s, b) => [a[0] + s * b[0], a[1] + s * b[1], a[2] + s * b[2]];
      return [
        add(add(center, -hw, t), -hh, u),
        add(add(center, +hw, t), -hh, u),
        add(add(center, +hw, t), +hh, u),
        add(add(center, -hw, t), +hh, u),
      ];
    };
    const setMeshQuadEnu = (mesh, quadEnu) => {
      if (!mesh || !mesh.geometry) return;
      const a = to3(...quadEnu[0]), b = to3(...quadEnu[1]);
      const c = to3(...quadEnu[2]), d = to3(...quadEnu[3]);
      const arr = new Float32Array([
        a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z,
        a.x, a.y, a.z, c.x, c.y, c.z, d.x, d.y, d.z,
      ]);
      mesh.geometry.setAttribute('position', new THREE.BufferAttribute(arr, 3));
      mesh.geometry.computeVertexNormals();
    };
    const orientPivot = (centerEnu, nArr) => {
      const { n, t, u } = facadeAxesEnu(nArr);
      const x = to3(t[0], t[1], t[2]).normalize();
      const y = to3(u[0], u[1], u[2]).normalize();
      const z = to3(n[0], n[1], n[2]).normalize();
      const m = new THREE.Matrix4().makeBasis(x, y, z);
      sculptPivot.position.copy(to3(centerEnu[0], centerEnu[1], centerEnu[2]));
      sculptPivot.quaternion.setFromRotationMatrix(m);
      sculptPivot.scale.set(1, 1, 1);
      sculptPivot.updateMatrixWorld(true);
    };
    const updateSculptStatus = () => {
      const el = document.getElementById('sculptStatus');
      if (!el) return;
      if (!sculptOn) { el.textContent = 'sculpt: off'; return; }
      if (!selected) { el.textContent = 'sculpt: click a façade (Esc clears)'; return; }
      const s = selected;
      el.textContent = `sculpt: ${s.id}  zncc=${s.zncc ?? '—'}  w=${s.width_m.toFixed(2)} h=${s.height_m.toFixed(2)}  n=[${s.nEnu.map(v => v.toFixed(2)).join(',')}]`;
    };
    const setSculptMode = (mode) => {
      if (mode === 'scale') {
        tcontrols.setMode('scale');
        tcontrols.showX = true; tcontrols.showY = true; tcontrols.showZ = false;
      } else {
        tcontrols.setMode('translate');
        tcontrols.showX = false; tcontrols.showY = false; tcontrols.showZ = true;
      }
    };
    const clearSelect = () => {
      if (selected && selected.mesh && selected.mesh.material) {
        selected.mesh.material.opacity = 0.02;
        selected.mesh.material.color.setHex(0x44aaff);
      }
      selected = null;
      baseSelect = null;
      tcontrols.detach();
      tcontrols.visible = false;
      tcontrols.enabled = false;
      for (const id of ['btnSculptTranslate', 'btnSculptScale', 'btnSculptSave']) {
        const b = document.getElementById(id); if (b) b.disabled = true;
      }
      updateSculptStatus();
    };
    const selectPlane = (entry) => {
      clearSelect();
      selected = {
        id: entry.id,
        index: entry.index,
        nEnu: entry.nEnu.slice(),
        centerEnu: entry.centerEnu.slice(),
        width_m: entry.width_m,
        height_m: entry.height_m,
        zncc: entry.zncc,
        mesh: entry.mesh,
      };
      baseSelect = {
        centerEnu: entry.centerEnu.slice(),
        width_m: entry.width_m,
        height_m: entry.height_m,
      };
      if (entry.mesh && entry.mesh.material) {
        entry.mesh.material.opacity = 0.35;
        entry.mesh.material.color.setHex(0xe8c36a);
      }
      orientPivot(selected.centerEnu, selected.nEnu);
      tcontrols.attach(sculptPivot);
      tcontrols.visible = true;
      tcontrols.enabled = true;
      setSculptMode('translate');
      for (const id of ['btnSculptTranslate', 'btnSculptScale', 'btnSculptSave']) {
        const b = document.getElementById(id); if (b) b.disabled = false;
      }
      updateSculptStatus();
    };
    const syncSelectedFromPivot = () => {
      if (!selected || !baseSelect) return;
      const { n, t } = facadeAxesEnu(selected.nEnu);
      if (tcontrols.mode === 'translate') {
        const cur = sculptPivot.position.clone();
        const base = to3(baseSelect.centerEnu[0], baseSelect.centerEnu[1], baseSelect.centerEnu[2]);
        const dWorld = cur.sub(base);
        // Three (e,u,-n) → ENU delta
        const dEnu = [dWorld.x, -dWorld.z, dWorld.y];
        let dd = dEnu[0] * n[0] + dEnu[1] * n[1] + dEnu[2] * n[2];
        let dt = dEnu[0] * t[0] + dEnu[1] * t[1] + dEnu[2] * t[2];
        dd = Math.max(-SCULPT_MAX_D, Math.min(SCULPT_MAX_D, dd));
        dt = Math.max(-SCULPT_MAX_T, Math.min(SCULPT_MAX_T, dt));
        selected.centerEnu = [
          baseSelect.centerEnu[0] + dd * n[0] + dt * t[0],
          baseSelect.centerEnu[1] + dd * n[1] + dt * t[1],
          baseSelect.centerEnu[2] + dd * n[2] + dt * t[2],
        ];
        orientPivot(selected.centerEnu, selected.nEnu);
      } else {
        let sx = Math.abs(sculptPivot.scale.x) || 1;
        let sy = Math.abs(sculptPivot.scale.y) || 1;
        sx = Math.max(0.2, Math.min(4, sx));
        sy = Math.max(0.2, Math.min(4, sy));
        selected.width_m = Math.max(0.5, baseSelect.width_m * sx);
        selected.height_m = Math.max(0.5, baseSelect.height_m * sy);
      }
      const quad = cornersEnu(selected.centerEnu, selected.nEnu, selected.width_m, selected.height_m);
      setMeshQuadEnu(selected.mesh, quad);
      if (facadeRoot) {
        facadeRoot.traverse((ch) => {
          if (!ch.isMesh) return;
          const mats = Array.isArray(ch.material) ? ch.material : [ch.material];
          if (!mats.some((m) => m && m.name === selected.id)) return;
          const pos = ch.geometry.getAttribute('position');
          if (pos && pos.count >= 4 && pos.count <= 6) setMeshQuadEnu(ch, quad);
        });
      }
      updateSculptStatus();
    };
    tcontrols.addEventListener('objectChange', syncSelectedFromPivot);

    const buildPickMeshes = () => {
      while (pickGroup.children.length) {
        const c = pickGroup.children.pop();
        c.geometry?.dispose?.();
        c.material?.dispose?.();
      }
      planeEntries = [];
      const planes = (planesPayload && planesPayload.planes) || [];
      planes.forEach((pl, index) => {
        const id = pl.id || (`facade_${String(index).padStart(2, '0')}`);
        const quad = pl.quad || pl.corners;
        if (!quad || quad.length < 4) return;
        const center = pl.center || [
          (quad[0][0] + quad[1][0] + quad[2][0] + quad[3][0]) / 4,
          (quad[0][1] + quad[1][1] + quad[2][1] + quad[3][1]) / 4,
          (quad[0][2] + quad[1][2] + quad[2][2] + quad[3][2]) / 4,
        ];
        const nEnu = (pl.n || [0, 1, 0]).slice(0, 3);
        nEnu[2] = 0;
        const mesh = new THREE.Mesh(
          new THREE.BufferGeometry(),
          new THREE.MeshBasicMaterial({
            color: 0x44aaff, transparent: true, opacity: 0.02,
            side: THREE.DoubleSide, depthWrite: false,
          })
        );
        mesh.userData.planeId = id;
        setMeshQuadEnu(mesh, quad);
        pickGroup.add(mesh);
        planeEntries.push({
          id, index, nEnu,
          centerEnu: center.slice(),
          width_m: Number(pl.width_m) || 1,
          height_m: Number(pl.height_m) || 1,
          zncc: pl.zncc, mesh,
        });
      });
    };

    try {
      planesPayload = await (await fetch('/api/runs/' + encodeURIComponent(run) + '/planes.json')).json();
      buildPickMeshes();
      hud.innerHTML += `<br>planes ${planeEntries.length}`;
    } catch (err) {
      hud.innerHTML += '<br>no planes.json';
    }
    try {
      const camPayload = await (await fetch('/api/runs/' + encodeURIComponent(run) + '/sculpt/cameras')).json();
      const sel = document.getElementById('sculptCam');
      if (sel && camPayload.cameras) {
        for (const c of camPayload.cameras) {
          const opt = document.createElement('option');
          opt.value = c.pano_id || '';
          const label = (c.pano_id || ('cam' + c.index)).slice(0, 18);
          opt.textContent = label + ' h' + Math.round(c.heading || 0);
          sel.appendChild(opt);
        }
      }
    } catch (err) { /* optional */ }

    const setSculptEnabled = (on) => {
      sculptOn = !!on;
      pickGroup.visible = sculptOn;
      const undoBtn = document.getElementById('btnSculptUndo');
      if (undoBtn) undoBtn.disabled = !sculptOn;
      const camSel = document.getElementById('sculptCam');
      if (camSel) camSel.disabled = !sculptOn;
      if (!sculptOn) clearSelect();
      else updateSculptStatus();
    };
    document.getElementById('togSculpt')?.addEventListener('change', (ev) => {
      setSculptEnabled(ev.target.checked);
    });
    document.getElementById('btnSculptTranslate')?.addEventListener('click', () => {
      if (!selected) return;
      baseSelect = { centerEnu: selected.centerEnu.slice(), width_m: selected.width_m, height_m: selected.height_m };
      sculptPivot.scale.set(1, 1, 1);
      orientPivot(selected.centerEnu, selected.nEnu);
      setSculptMode('translate');
    });
    document.getElementById('btnSculptScale')?.addEventListener('click', () => {
      if (!selected) return;
      baseSelect = { centerEnu: selected.centerEnu.slice(), width_m: selected.width_m, height_m: selected.height_m };
      sculptPivot.scale.set(1, 1, 1);
      orientPivot(selected.centerEnu, selected.nEnu);
      setSculptMode('scale');
    });

    const postSculpt = async () => {
      if (!selected) return;
      const camSel = document.getElementById('sculptCam');
      const body = {
        plane_id: selected.id,
        corners: cornersEnu(selected.centerEnu, selected.nEnu, selected.width_m, selected.height_m),
        width_m: selected.width_m,
        height_m: selected.height_m,
        n: selected.nEnu,
        bake: true,
        bake_cam: (camSel && camSel.value) ? camSel.value : null,
      };
      const resp = await fetch('/api/runs/' + encodeURIComponent(run) + '/sculpt', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await resp.json();
      if (!data.ok) {
        alert('sculpt failed: ' + (data.error || resp.status));
        return;
      }
      const note = data.bake_ok ? 'baked' : ('bake soft-fail: ' + (data.bake_error || 'n/a'));
      hud.innerHTML += `<br>saved ${data.plane_id} (${note})`;
      try {
        planesPayload = await (await fetch('/api/runs/' + encodeURIComponent(run) + '/planes.json?t=' + Date.now())).json();
        buildPickMeshes();
        const again = planeEntries.find((e) => e.id === data.plane_id);
        if (again) selectPlane(again);
      } catch (e) { /* ignore */ }
      if (facadeRoot && data.bake_ok) {
        facadeRoot.traverse((ch) => {
          if (!ch.isMesh || !ch.material) return;
          const mats = Array.isArray(ch.material) ? ch.material : [ch.material];
          for (const m of mats) {
            if (m && m.name === selected.id && m.map) {
              const url = '/api/runs/' + encodeURIComponent(run) + '/textures/' + selected.id + '.jpg?t=' + Date.now();
              m.map = new THREE.TextureLoader().load(url);
              m.map.colorSpace = THREE.SRGBColorSpace;
              m.map.magFilter = THREE.NearestFilter;
              m.map.minFilter = THREE.NearestFilter;
              m.map.generateMipmaps = false;
              m.needsUpdate = true;
            }
          }
        });
      }
    };
    document.getElementById('btnSculptSave')?.addEventListener('click', () => postSculpt());
    document.getElementById('btnSculptUndo')?.addEventListener('click', async () => {
      const resp = await fetch('/api/runs/' + encodeURIComponent(run) + '/sculpt/undo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}',
      });
      const data = await resp.json();
      if (!data.ok) { alert('undo failed: ' + (data.error || resp.status)); return; }
      location.reload();
    });

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    renderer.domElement.addEventListener('pointerdown', (ev) => {
      if (!sculptOn || ev.button !== 0) return;
      if (tcontrols.dragging) return;
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(pickGroup.children, false);
      if (hits.length) {
        const id = hits[0].object.userData.planeId;
        const entry = planeEntries.find((e) => e.id === id);
        if (entry) selectPlane(entry);
      }
    });
    addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape' && sculptOn) clearSelect();
    });

    document.getElementById('togCloud')?.addEventListener('change', (ev) => {
      if (cloudPoints) cloudPoints.visible = ev.target.checked;
    });
    document.getElementById('togZclean')?.addEventListener('change', (ev) => {
      if (zcleanPoints) {
        zcleanPoints.visible = ev.target.checked;
        // Prefer zclean alone when toggled on (raw still available via cloud checkbox)
        if (ev.target.checked && cloudPoints) cloudPoints.visible = false;
        const tc = document.getElementById('togCloud');
        if (ev.target.checked && tc) tc.checked = false;
        if (ev.target.checked && offtilePoints) {
          offtilePoints.visible = false;
          const to = document.getElementById('togOfftile');
          if (to) to.checked = false;
        }
      }
    });
    document.getElementById('togOfftile')?.addEventListener('change', (ev) => {
      if (offtilePoints) {
        offtilePoints.visible = ev.target.checked;
        if (ev.target.checked && cloudPoints) cloudPoints.visible = false;
        const tc = document.getElementById('togCloud');
        if (ev.target.checked && tc) tc.checked = false;
        if (ev.target.checked && zcleanPoints) {
          zcleanPoints.visible = false;
          const tz = document.getElementById('togZclean');
          if (tz) tz.checked = false;
        }
      }
    });
    document.getElementById('togFacades')?.addEventListener('change', (ev) => {
      if (facadeRoot) facadeRoot.visible = ev.target.checked;
    });
    document.getElementById('togRoofs')?.addEventListener('change', (ev) => {
      if (roofRoot) roofRoot.visible = ev.target.checked;
    });
    document.getElementById('togBag')?.addEventListener('change', (ev) => {
      bagGroup.visible = ev.target.checked;
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    (function tick() {
      requestAnimationFrame(tick);
      controls.update();
      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
