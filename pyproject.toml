[project]
name = "ps1-hood"
version = "0.1.0"
description = "Rebuild a street-scale 3D neighborhood from Street View + satellite imagery."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=10.0",
    "httpx>=0.27",
    "scipy>=1.13",
    "flask>=3.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "duckdb>=1.5.5",
    "pyogrio>=0.13.0",
    "shapely>=2.1.2",
    "pyarrow>=25.0.1",
    "pyproj>=3.7.2",
]

[project.optional-dependencies]
browser = ["playwright>=1.47"]
dev = ["pytest>=8.0"]
# MASt3R is not pip-installable as a single package from PyPI here.
# Install from https://github.com/naver/mast3r (torch+cuda + weights) yourself.
# This empty extra documents the optional path:  uv sync --extra mast3r
mast3r = []
# MapAnything: install from https://github.com/facebookresearch/map-anything (CUDA).
# uv sync --extra mapanything  (documents optional path; package not on PyPI here)
mapanything = []

[project.scripts]
ps1hood = "ps1_hood.cli:main"
ps1-hood = "ps1_hood.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
